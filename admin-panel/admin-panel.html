<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRU Robot Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-zone:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-zone.dragging {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-meta {
            font-size: 14px;
            color: #666;
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-danger {
            background: #e53e3e;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status.online {
            background: #48bb78;
            color: white;
        }

        .status.offline {
            background: #e53e3e;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 JRU Campus Robot - Admin Panel</h1>
            <p>Manage knowledge base and robot settings</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="fileCount">-</div>
                <div class="stat-label">Files in Knowledge Base</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSize">-</div>
                <div class="stat-label">Total Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="robotStatus">-</div>
                <div class="stat-label">Robot Status</div>
            </div>
        </div>

        <!-- Upload Panel -->
        <div class="panel">
            <h2>📤 Upload Files</h2>
            
            <div id="message"></div>

            <div class="upload-zone" id="uploadZone">
                <p style="font-size: 48px; margin-bottom: 10px;">📁</p>
                <p style="font-size: 18px; color: #667eea; margin-bottom: 10px;">
                    Drag & drop files here or click to browse
                </p>
                <p style="color: #666; font-size: 14px;">
                    Supported: PDF, CSV, TXT (max 50MB)
                </p>
                <input type="file" id="fileInput" accept=".pdf,.csv,.txt" multiple>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn" id="uploadBtn" disabled>
                    Upload Selected Files
                </button>
                <button class="btn" id="rebuildBtn">
                    Rebuild Knowledge Base
                </button>
            </div>
        </div>

        <!-- Files Panel -->
        <div class="panel">
            <h2>📚 Knowledge Base Files</h2>
            <div id="filesList" class="loading">Loading files...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let selectedFiles = [];

        // Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const rebuildBtn = document.getElementById('rebuildBtn');
        const filesList = document.getElementById('filesList');
        const messageDiv = document.getElementById('message');

        // Load initial data
        loadFiles();

        // Upload zone click
        uploadZone.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            uploadBtn.disabled = selectedFiles.length === 0;
            uploadBtn.textContent = `Upload ${selectedFiles.length} File(s)`;
        });

        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragging');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragging');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
            selectedFiles = Array.from(e.dataTransfer.files);
            uploadBtn.disabled = selectedFiles.length === 0;
            uploadBtn.textContent = `Upload ${selectedFiles.length} File(s)`;
        });

        // Upload button
        uploadBtn.addEventListener('click', async () => {
            await uploadFiles(selectedFiles);
            selectedFiles = [];
            fileInput.value = '';
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Upload Selected Files';
            loadFiles();
        });

        // Rebuild button
        rebuildBtn.addEventListener('click', async () => {
            if (!confirm('Rebuild knowledge base? This may take a few minutes.')) return;
            
            rebuildBtn.disabled = true;
            rebuildBtn.textContent = 'Rebuilding...';
            
            try {
                rebuildBtn.disabled = true;
                rebuildBtn.textContent = 'Rebuilding...';
                
                const response = await fetch(`${API_BASE}/rebuild-kb`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Knowledge base rebuilt successfully!', 'success');
                } else {
                    showMessage('Rebuild failed: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                rebuildBtn.disabled = false;
                rebuildBtn.textContent = 'Rebuild Knowledge Base';
                loadFiles();
            }
        });

        // Functions
        async function uploadFiles(files) {
            const formData = new FormData();
            
            // Append all files
            for (const file of files) {
                formData.append('files', file);
            }
            
            try {
                uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading...';
                
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const uploadedCount = data.uploaded.length;
                    showMessage(`✅ Successfully uploaded ${uploadedCount} file(s)`, 'success');
                    
                    // Show details
                    data.uploaded.forEach(file => {
                        console.log(`✅ ${file.filename} (${file.storage})`);
                    });
                    
                    if (data.errors.length > 0) {
                        data.errors.forEach(err => {
                            showMessage(`⚠️ ${err}`, 'error');
                        });
                    }
                } else {
                    showMessage(`❌ Upload failed`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Error uploading files: ${error.message}`, 'error');
            }
        }

        async function loadFiles() {
            try {
                const response = await fetch(`${API_BASE}/files`);
                const data = await response.json();
                
                // Update stats
                const totalFiles = data.total_files || 0;
                const totalSize = data.files.reduce((sum, f) => sum + (f.size || 0), 0);
                
                document.getElementById('fileCount').textContent = totalFiles;
                document.getElementById('totalSize').textContent = 
                    totalSize > 0 ? (totalSize / 1024 / 1024).toFixed(2) + ' MB' : '0 MB';
                
                // Render file list
                if (data.files.length === 0) {
                    filesList.innerHTML = '<p style="text-align: center; color: #666;">No files uploaded yet</p>';
                } else {
                    filesList.innerHTML = '<ul class="file-list">' + 
                        data.files.map(file => `
                            <li class="file-item">
                                <div class="file-info">
                                    <div class="file-name">📄 ${file.name}</div>
                                    <div class="file-meta">
                                        ${(file.size / 1024).toFixed(2)} KB • 
                                        ${file.storage_type} • 
                                        ${new Date(file.uploaded_at).toLocaleString()}
                                    </div>
                                </div>
                            </li>
                        `).join('') +
                    '</ul>';
                }
            } catch (error) {
                filesList.innerHTML = '<p style="color: red;">Error loading files: ' + error.message + '</p>';
            }
        }

        async function deleteFile(filename) {
            if (!confirm(`Delete ${filename}?`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/files/${filename}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer dummy-token'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`${filename} deleted`, 'success');
                    loadFiles();
                } else {
                    showMessage(`Delete failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function loadRobotStatus() {
            // Status check - update this when robot API is available
            document.getElementById('robotStatus').textContent = 'N/A';
        }

        function showMessage(text, type) {
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // Refresh every 30 seconds
        setInterval(() => {
            loadFiles();
        }, 30000);
    </script>
</body>
</html>
